# Serves the built SPA inside this image. The reverse proxy that fronts it -
# and routes /api to the backend - lives in the backend repository's compose
# stack; this only has to hand back index.html for client-side routes.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed filenames, so they can be cached indefinitely
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cached: it is what points at the current asset hashes, and a stale
    # copy would keep loading files that no longer exist after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
