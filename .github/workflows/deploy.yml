name: Build & Deploy FE

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  gate:
    name: Lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  build-and-push:
    name: Build & push image
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set lowercase image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # VITE_API_BASE_URL is a relative path on purpose - the backend's nginx
      # serves this bundle and proxies /api from the same origin.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Deploys this commit's tag rather than :latest, so a run cannot pick up
      # whatever finished building most recently.
      - name: Resolve image reference
        run: |
          IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-7)
          echo "FE_IMAGE=${{ env.REGISTRY }}/${IMAGE_NAME}:sha-${SHORT_SHA}" >> "$GITHUB_ENV"

      # No files are copied: the compose file that defines this service belongs
      # to the backend repository and is deployed by its own pipeline. This job
      # only swaps the image the fe service runs, and records it in the
      # server's .env so the backend's deploy keeps it.
      - name: Deploy and verify
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          port: ${{ secrets.CONTABO_PORT }}
          envs: FE_IMAGE
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            export FE_IMAGE
            echo "Deploying $FE_IMAGE"

            # Pin the image in .env as well. The backend's deploy runs a bare
            # `docker compose up -d`, where FE_IMAGE is unset and compose falls
            # back to a local blog-post-generator-fe:latest. This job only pulls
            # sha- tags, so that local latest is stale: every backend deploy
            # recreated fe from it and rolled the UI back to an old build.
            # Recorded here, the bare command resolves to this deploy's image
            # and leaves fe alone. The exported variable still wins for this run.
            if grep -q '^FE_IMAGE=' .env; then
              sed -i.bak "s|^FE_IMAGE=.*|FE_IMAGE=${FE_IMAGE}|" .env && rm -f .env.bak
            else
              printf '\n# Written by the FE deploy so a bare `docker compose up` uses this build\nFE_IMAGE=%s\n' "${FE_IMAGE}" >> .env
            fi

            docker compose pull fe

            # --no-deps keeps a frontend deploy from touching the API stack:
            # this service has no dependencies of its own to bring up.
            docker compose up -d --no-deps fe

            # Served from inside the compose network, which is how the backend's
            # nginx reaches it. Going through the public URL would hit Cloudflare
            # Access and come back as a login page.
            #
            # Polled rather than checked once: a recreated container reports
            # "Started" as soon as its process launches, before nginx inside it
            # is listening, so a single check right after `up` races the startup
            # and fails with "connection refused" on a healthy deploy.
            for i in $(seq 1 15); do
              if docker compose exec -T nginx wget --spider -q http://fe/; then
                echo "fe is serving"
                break
              fi
              if [ "$i" -eq 15 ]; then
                echo "fe did not answer within 30s"
                docker compose logs --tail 50 fe
                exit 1
              fi
              sleep 2
            done

            # The serving container is not necessarily this deploy's: anything
            # that resolved FE_IMAGE differently would leave another build
            # answering the check above.
            RUNNING=$(docker inspect -f '{{.Config.Image}}' blog-generator-fe)
            if [ "$RUNNING" != "$FE_IMAGE" ]; then
              echo "fe is running $RUNNING, expected $FE_IMAGE"
              exit 1
            fi
            echo "Running $RUNNING"

            docker image prune -f
            docker compose ps fe
